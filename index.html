  <body>
    <!-- Static copy of the RSVP form so Netlify Forms detects it at deploy time -->
    <form name="rsvp" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="attending" />
      <input name="guests" />
      <input name="events" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
